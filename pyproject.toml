[project]
name = "cairnkit"
version = "0.4.1"
description = "A small agent runtime for business apps: the host owns identity, writes become drafts a person approves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "wasabihu", email = "wasabi.net@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "llm", "agent-runtime", "human-in-the-loop", "memory", "context-compression", "hermes-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/wasabihu/cairnkit"
Repository = "https://github.com/wasabihu/cairnkit"
Issues = "https://github.com/wasabihu/cairnkit/issues"
Changelog = "https://github.com/wasabihu/cairnkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
documents = [
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.10",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairnkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Kept close to the Hermes original so upstream changes can be diffed line by line.
"cairnkit/security.py" = ["E501"]
